<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<title>Адам басы — бас пен мойынның 3D атласы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Орташа ересек қазақ ер адамы мен әйелінің басы мен мойнының интерактивті 3D атласы. Interactive 3D atlas of the head and neck of the average adult Kazakh man and woman.">
<meta name="theme-color" content="#0F1113">
<meta property="og:title" content="АДАМ БАСЫ — The Head">
<meta property="og:description" content="Interactive 3D atlas of the head and neck of the average adult Kazakh man and woman.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1113'/%3E%3Cpath d='M32 12c-10 0-17 8-17 18 0 6 3 10 5 13v7c0 2 2 3 4 3h10c7 0 12-5 12-11v-4l3-1-3-6c1-10-5-19-14-19z' fill='none' stroke='%23D1FE17' stroke-width='3.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/inter-cyrillic-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-cyrillic-ext-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="src/hero/hero.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/jsm/" } }
</script>
</head>
<body>
<!-- mount point for the opening film (site/src/hero/, added by the lead); empty and hidden until then -->
<section id="hero" hidden></section>

<canvas id="gl" aria-label="3D"></canvas>

<div id="tip" aria-hidden="true"><b></b><i></i></div>
<div id="grip" aria-hidden="true"><span></span></div>

<header id="brand">
  <div class="brand-row">
    <h1 class="wordmark h" data-i18n-brand>АДАМ <mark>БАСЫ</mark></h1>
    <span class="brand-by"><span class="by">by</span><img src="assets/ui/hf-wordmark.png" alt="Higgsfield" width="72" height="14" decoding="async"></span>
  </div>
  <div class="sub" id="brand-sub" data-i18n="sub"></div>
</header>

<nav id="top">
  <button id="btn-search" class="btn-icon" data-i18n-aria="searchAria"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.25"/><path d="M15.6 15.6L20 20"/></svg></button>
  <div id="sex" class="seg" role="group" data-i18n-aria="sexAria">
    <i class="knob" aria-hidden="true"></i>
    <button data-sex="m" class="on"><svg class="sil" viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="3.2"/><path d="M6.5 21v-5.5c0-3 2.4-5 5.5-5s5.5 2 5.5 5V21"/></svg><span class="lbl" data-i18n="kid.male"></span></button>
    <button data-sex="f"><svg class="sil" viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="3.2"/><path d="M6 21l2.2-7.2c.7-2.2 2-3.3 3.8-3.3s3.1 1.1 3.8 3.3L18 21"/><path d="M8.6 3.8c-1.4 1.2-2 3.4-1.4 5.6M15.4 3.8c1.4 1.2 2 3.4 1.4 5.6"/></svg><span class="lbl" data-i18n="kid.female"></span></button>
  </div>
  <div id="langs" class="seg" role="group" data-i18n-aria="langAria">
    <i class="knob" aria-hidden="true"></i>
    <button class="lang" data-lang="kk" lang="kk">ҚАЗ</button>
    <button class="lang" data-lang="ru" lang="ru">РУС</button>
    <button class="lang" data-lang="en" lang="en">ENG</button>
  </div>
  <button id="sound" class="btn-icon" data-i18n-aria="sound"><svg viewBox="0 0 24 24"><path class="spk" d="M3.5 9.2h3.6L12 5.2v13.6l-4.9-4H3.5z"/><path class="w1" d="M15.2 9.8c.9 1.2.9 3.2 0 4.4"/><path class="w2" d="M17.8 7.4c2.1 2.6 2.1 6.6 0 9.2"/><path class="x" d="M16 10l4 4M20 10l-4 4"/></svg></button>
  <button id="about" class="btn-icon" data-i18n-aria="aboutAria"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.25"/><path d="M12 11v5.2"/><path class="dot" d="M12 7.9v.1"/></svg></button>
</nav>

<aside id="rail" aria-label="layers">
  <div class="rail-label" data-i18n="kid.inside"></div>
  <ol></ol>
</aside>

<div id="caption" aria-live="polite"><div class="n"></div><div class="t h"></div><div class="s"></div></div>

<div id="hint"></div>
<div id="hand" aria-hidden="true">
  <div class="hstep turn"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.6 4.2v3.6H16"/></svg><b data-i18n="kid.turn"></b></div>
  <div class="hand-ico"><svg viewBox="0 0 48 48"><path d="M19 27V9.5a3 3 0 016 0V23l0-5a3 3 0 016 0v6-3a3 3 0 016 0v10c0 7-4.5 12-11 12h-2c-4 0-6.6-1.8-8.6-5L9.7 30.5a3 3 0 015-3.3L19 32"/></svg><i class="ripple"></i></div>
  <div class="hstep tap"><b data-i18n="kid.tap"></b></div>
</div>

<div id="dock">
  <div id="sections" class="subsec" role="group">
    <button data-sec="sagittal"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="7.5" ry="8.75"/><path d="M12 2.5v19" class="hl"/></svg><span data-i18n="kid.side"></span></button>
    <button data-sec="axial"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="7.5" ry="8.75"/><path d="M3 12h18" class="hl"/></svg><span data-i18n="kid.top"></span></button>
    <button data-sec="coronal"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="7.5" ry="8.75"/><ellipse cx="12" cy="12" rx="2.6" ry="8.75" class="hl"/></svg><span data-i18n="kid.front"></span></button>
  </div>
  <button id="btn-cut" class="bigbtn"><svg viewBox="0 0 24 24"><circle cx="6.5" cy="6.5" r="2.75"/><circle cx="6.5" cy="17.5" r="2.75"/><path d="M8.7 8.2L20 17.5M8.7 15.8L20 6.5"/></svg><span class="bl" data-i18n="kid.cut"></span></button>
  <button id="btn-organs" class="bigbtn primary"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.75"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.75"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.75"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.75"/></svg><span class="bl" data-i18n="kid.organs"></span></button>
  <button id="btn-tour" class="bigbtn"><svg viewBox="0 0 24 24"><path class="play" d="M8.5 6.2v11.6c0 .6.7 1 1.2.7l9-5.8c.5-.3.5-1.1 0-1.4l-9-5.8c-.5-.3-1.2.1-1.2.7z"/><path class="pause" d="M8 6h2.6v12H8zM13.4 6H16v12h-2.6z"/></svg><span class="bl"></span></button>
</div>

<aside id="panel" aria-live="polite">
  <button id="panel-close" class="btn-icon" data-i18n-aria="panel.close"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
  <div class="pscroll">
    <div class="sys"></div>
    <h2 class="name h"></h2>
    <p class="role"></p>
    <div class="wow"><svg class="star" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.2c.2.6.8 1.2 1.4 1.4l5.2 1.9-5.2 1.9c-.6.2-1.2.8-1.4 1.4L12 20.5l-1.9-5.2c-.2-.6-.8-1.2-1.4-1.4L3.5 12l5.2-1.9c.6-.2 1.2-.8 1.4-1.4z"/></svg><span class="wt"></span></div>
    <div id="dive-links"></div>
    <button class="pmore"></button>
    <div class="pdetail">
      <div class="la"></div>
      <div class="alt"></div>
      <ul class="facts"></ul>
    </div>
  </div>
  <div class="nav">
    <button id="prev" class="btn-icon" data-i18n-aria="panel.prev"><svg viewBox="0 0 24 24"><path d="M19 12H5.5M11 6l-6 6 6 6"/></svg></button>
    <button id="next" class="btn-icon" data-i18n-aria="panel.next"><svg viewBox="0 0 24 24"><path d="M5 12h13.5M13 6l6 6-6 6"/></svg></button>
  </div>
</aside>

<section id="dive" hidden>
  <button id="dive-back" class="bigbtn"><svg class="ar" viewBox="0 0 24 24"><path d="M19 12H5.5M11 6l-6 6 6 6"/></svg><span class="bl" data-i18n="kid.back"></span></button>
  <div class="dive-col">
    <div class="eyebrow"></div>
    <div class="ct h"></div>
    <div class="cx"></div>
    <button class="more" hidden></button>
    <ul class="dfacts"></ul>
  </div>
  <ol class="dive-steps"></ol>
  <div class="dive-nav">
    <button id="dive-apart" class="bigbtn"><svg viewBox="0 0 24 24"><path d="M9.5 9.5L4.5 4.5M4.5 4.5v4M4.5 4.5h4M14.5 9.5l5-5M19.5 4.5v4M19.5 4.5h-4M9.5 14.5l-5 5M4.5 19.5v-4M4.5 19.5h4M14.5 14.5l5 5M19.5 19.5v-4M19.5 19.5h-4"/></svg><span class="bl" data-i18n="kid.apart"></span></button>
    <button id="dive-next" class="bigbtn primary"><span class="bl" data-i18n="kid.next"></span><svg class="ar" viewBox="0 0 24 24"><path d="M5 12h13.5M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="dive-explode"><input id="dive-x" type="range" min="0" max="1" step="0.001" value="0" data-i18n-aria="kid.apart"></div>
  <svg class="dive-leaders" aria-hidden="true"></svg>
  <div class="dive-labels" aria-hidden="true"></div>
</section>
<section id="diveframe" hidden>
  <iframe title="eye" allow="autoplay"></iframe>
  <button id="diveframe-back" class="bigbtn" data-i18n-aria="dive.back"><svg viewBox="0 0 24 24"><path d="M19 12H5.5M11 6l-6 6 6 6"/></svg><b data-i18n="dive.back"></b></button>
</section>

<section id="organs" hidden role="dialog" aria-modal="true">
  <div class="box">
    <div class="ohead">
      <h2 class="otitle h" data-i18n="organs.title"></h2>
      <button id="organs-close" class="btn-icon" data-i18n-aria="panel.close"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
    <ol class="ogrid"></ol>
  </div>
</section>

<section id="search" hidden role="dialog">
  <div class="box">
    <label class="qrow"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.25"/><path d="M15.6 15.6L20 20"/></svg><input id="q" type="search" autocomplete="off" spellcheck="false"><kbd>esc</kbd></label>
    <div class="shint" data-i18n="search.hint"></div>
    <ol id="results"></ol>
  </div>
</section>

<section id="aboutbox" hidden role="dialog" aria-modal="true">
  <div class="inner">
    <button id="about-close" class="btn-icon" data-i18n-aria="panel.close"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    <div class="about-by"><span class="by">by</span><img src="assets/ui/hf-wordmark.png" alt="Higgsfield" width="72" height="14" decoding="async"></div>
    <h2 class="h"></h2>
    <div class="about-body"></div>
    <h3 class="simpl-t"></h3>
    <ul class="simpl"></ul>
    <h3 class="lic-t"></h3>
    <ul class="lic"></ul>
    <h3 class="src-t"></h3>
    <ol class="sources"></ol>
    <p class="credit"></p>
  </div>
</section>

<div id="loader">
  <div class="ttl h" data-i18n-brand>АДАМ <mark>БАСЫ</mark></div>
  <div class="bar"><i></i></div>
  <div class="lsub"><span data-i18n="loading">Жүктелуде</span> <b>0</b></div>
  <div class="lby"><span class="by">by</span><img src="assets/ui/hf-wordmark.png" alt="Higgsfield" width="72" height="14" decoding="async"></div>
</div>

<noscript><p style="color:#F7F7F8;font:15px/1.5 system-ui,sans-serif;padding:40px">JavaScript + WebGL2 required.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
