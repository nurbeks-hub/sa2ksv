<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<title>Адам басы — бас пен мойынның 3D атласы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Орташа ересек қазақ ер адамы мен әйелінің басы мен мойнының интерактивті 3D атласы. Interactive 3D atlas of the head and neck of the average adult Kazakh man and woman.">
<meta name="theme-color" content="#07080a">
<meta property="og:title" content="АДАМ БАСЫ — The Head">
<meta property="og:description" content="Interactive 3D atlas of the head and neck of the average adult Kazakh man and woman.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307080a'/%3E%3Cpath d='M32 12c-10 0-17 8-17 18 0 6 3 10 5 13v7c0 2 2 3 4 3h10c7 0 12-5 12-11v-4l3-1-3-6c1-10-5-19-14-19z' fill='none' stroke='%23e9dcc3' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/manrope-cyrillic-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/jsm/" } }
</script>
</head>
<body>
<canvas id="gl" aria-label="3D"></canvas>

<div id="tip" aria-hidden="true"><b></b><i></i></div>
<div id="grip" aria-hidden="true"><span></span></div>

<header id="brand">
  <div class="wordmark" data-i18n="brand">АДАМ БАСЫ</div>
  <div class="sub mono" id="brand-sub" data-i18n="sub"></div>
</header>

<nav id="top">
  <button id="btn-search" class="icon big" data-i18n-aria="searchAria"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button>
  <div id="sex" class="seg" role="group" data-i18n-aria="sexAria">
    <button data-sex="m" class="on"><svg class="sil" viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="3.2"/><path d="M6.5 21v-5.5c0-3 2.4-5 5.5-5s5.5 2 5.5 5V21"/></svg><span class="lbl" data-i18n="kid.male"></span></button>
    <button data-sex="f"><svg class="sil" viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="3.2"/><path d="M6 21l2.2-7.2c.7-2.2 2-3.3 3.8-3.3s3.1 1.1 3.8 3.3L18 21"/><path d="M8.6 3.8c-1.4 1.2-2 3.4-1.4 5.6M15.4 3.8c1.4 1.2 2 3.4 1.4 5.6"/></svg><span class="lbl" data-i18n="kid.female"></span></button>
    <i class="knob"></i>
  </div>
  <div id="langs" role="group" data-i18n-aria="langAria">
    <button class="lang" data-lang="kk" lang="kk">ҚАЗ</button>
    <button class="lang" data-lang="ru" lang="ru">РУС</button>
    <button class="lang" data-lang="en" lang="en">ENG</button>
  </div>
  <button id="sound" class="icon big" data-i18n-aria="sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w1" d="M16 9.5c1 .8 1 4.2 0 5"/><path class="w2" d="M18.5 7c2.4 2 2.4 8 0 10"/></svg></button>
  <button id="about" class="icon big" data-i18n-aria="aboutAria"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".6"/></svg></button>
</nav>

<aside id="rail" aria-label="layers">
  <div class="rail-label" data-i18n="kid.inside"></div>
  <ol></ol>
</aside>

<div id="caption" aria-live="polite"><div class="t"></div><div class="s"></div><div class="n"></div></div>

<div id="hint"></div>
<div id="hand" aria-hidden="true">
  <div class="hstep turn"><svg viewBox="0 0 64 64"><path class="arc" d="M14 40c6-10 30-10 36 0"/><path class="arr" d="M46 33l5 7-8 1"/></svg><b data-i18n="kid.turn"></b></div>
  <div class="hand-ico"><svg viewBox="0 0 48 48"><path d="M19 27V9.5a3 3 0 016 0V23l0-5a3 3 0 016 0v6-3a3 3 0 016 0v10c0 7-4.5 12-11 12h-2c-4 0-6.6-1.8-8.6-5L9.7 30.5a3 3 0 015-3.3L19 32"/></svg><i class="ripple"></i></div>
  <div class="hstep tap"><b data-i18n="kid.tap"></b></div>
</div>

<div id="dock">
  <div id="sections" class="subsec" role="group">
    <button data-sec="sagittal"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="9"/><path d="M12 2.5v19" class="hl"/></svg><span data-i18n="kid.side"></span></button>
    <button data-sec="axial"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="9"/><path d="M3.5 12h17" class="hl"/></svg><span data-i18n="kid.top"></span></button>
    <button data-sec="coronal"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="9"/><ellipse cx="12" cy="12" rx="2.6" ry="9" class="hl"/></svg><span data-i18n="kid.front"></span></button>
  </div>
  <button id="btn-cut" class="bigbtn"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.3 8.1L20 18M8.3 15.9L20 6"/></svg><span class="bl" data-i18n="kid.cut"></span></button>
  <button id="btn-organs" class="bigbtn primary"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span class="bl" data-i18n="kid.organs"></span></button>
  <button id="btn-tour" class="bigbtn"><svg viewBox="0 0 24 24"><path class="play" d="M8 5.5v13l10.5-6.5z"/><path class="pause" d="M8 5h3v14H8zM13.5 5h3v14h-3z"/></svg><span class="bl"></span></button>
</div>

<aside id="panel" aria-live="polite">
  <button id="panel-close" class="icon big" data-i18n-aria="panel.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="sys"></div>
  <h1 class="name"></h1>
  <p class="role"></p>
  <div class="wow"><span class="star">★</span><span class="wt"></span></div>
  <div id="dive-links"></div>
  <button class="pmore"></button>
  <div class="pdetail">
    <div class="la"></div>
    <div class="alt"></div>
    <ul class="facts"></ul>
  </div>
  <div class="nav"><button id="prev" class="icon big">←</button><button id="next" class="icon big">→</button></div>
</aside>

<section id="dive" hidden>
  <button id="dive-back" class="bigbtn"><span class="ar">←</span><span class="bl" data-i18n="kid.back"></span></button>
  <div class="dive-col">
    <div class="eyebrow"></div>
    <div class="ct"></div>
    <div class="cx"></div>
    <button class="more" hidden></button>
    <ul class="dfacts"></ul>
  </div>
  <ol class="dive-steps"></ol>
  <div class="dive-nav">
    <button id="dive-apart" class="bigbtn"><svg viewBox="0 0 24 24"><path d="M9 9L4 4M4 4v4M4 4h4M15 9l5-5M20 4v4M20 4h-4M9 15l-5 5M4 20v-4M4 20h4M15 15l5 5M20 20v-4M20 20h-4"/></svg><span class="bl" data-i18n="kid.apart"></span></button>
    <button id="dive-next" class="bigbtn primary"><span class="bl" data-i18n="kid.next"></span><span class="ar">→</span></button>
  </div>
  <div class="dive-explode"><input id="dive-x" type="range" min="0" max="1" step="0.001" value="0" aria-label="explode"></div>
  <svg class="dive-leaders" aria-hidden="true"></svg>
  <div class="dive-labels" aria-hidden="true"></div>
</section>
<section id="diveframe" hidden>
  <iframe title="eye" allow="autoplay"></iframe>
  <button id="diveframe-back" class="mono"><span>←</span> <b data-i18n="dive.back"></b></button>
</section>

<section id="organs" hidden>
  <div class="box">
    <div class="otitle" data-i18n="organs.title"></div>
    <button id="organs-close" class="icon" data-i18n-aria="panel.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <ol class="ogrid"></ol>
  </div>
</section>

<section id="search" hidden>
  <div class="box">
    <input id="q" type="search" autocomplete="off" spellcheck="false">
    <div class="shint mono" data-i18n="search.hint"></div>
    <ol id="results"></ol>
  </div>
</section>

<section id="aboutbox" hidden>
  <div class="inner">
    <button id="about-close" class="icon" data-i18n-aria="panel.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2></h2>
    <div class="about-body"></div>
    <h3 class="mono simpl-t"></h3>
    <ul class="simpl"></ul>
    <h3 class="mono lic-t"></h3>
    <ul class="lic mono"></ul>
    <h3 class="mono src-t"></h3>
    <ol class="sources mono"></ol>
    <p class="credit mono"></p>
  </div>
</section>

<div id="loader">
  <div class="ttl" data-i18n="brand">АДАМ БАСЫ</div>
  <div class="bar"><i></i></div>
  <div class="lsub mono"><span data-i18n="loading">Жүктелуде</span> <b>0</b></div>
</div>

<noscript><p style="color:#ccc;font:14px sans-serif;padding:40px">JavaScript + WebGL2 required.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
